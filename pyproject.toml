[project]
name = "mlops-study"
version = "0.1.0"
description = "MLOps 입문 시리즈 실습 환경"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 3·4편: 실험 추적, 모델 레지스트리. 클라이언트와 서버(infra/mlflow) 버전을 맞춘다
    "mlflow==3.17.2",
    "boto3>=1.40",
    # evidently 0.7.23은 pandas 3에서 import가 깨진다(상한 미선언). evidently가 고칠 때까지 2.x 고정
    "pandas>=2.2,<3",
    "scikit-learn>=1.9",
    # 모델 유형별 학습: Time Series(LightGBM), Vision(PyTorch), LLM(transformers + LoRA)
    "lightgbm>=4.7",
    "torch>=2.15",
    "torchvision>=0.29",
    "transformers>=5.22",
    "peft>=0.21",
    "huggingface-hub>=1.0",
    "pillow>=11",
    # 5편: 서빙 (ONNX 변환과 Triton 클라이언트)
    "onnx>=1.23",
    "onnxmltools>=1.16",
    "onnxscript>=0.7",
    "skl2onnx>=1.20",
    "onnxruntime>=1.31",
    "tritonclient[http]>=2.74",
    # 6편: 오케스트레이션. infra/dagster 이미지도 이 lock 파일로 설치한다
    "dagster==1.13.28",
    "dagster-webserver==1.13.28",
    "dagster-postgres==0.29.28",
    # 7편: 모니터링
    "evidently>=0.7.23",
    # 8편: 하이퍼파라미터 탐색
    "optuna>=5.0",
    "optuna-integration>=5.0",
]

[dependency-groups]
dev = [
    "psycopg2-binary>=2.9",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "requests>=2.34",
    "ruff>=0.17",
]

# PyTorch는 CPU 전용 빌드를 쓴다. 기본 PyPI 휠은 CUDA 라이브러리까지 받아서 이미지가 수 GB 커진다
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "base: PostgreSQL, SeaweedFS, MLflow (기본 프로필, 4편)",
    "serving: Triton (serving 프로필, 5편)",
    "orchestration: Dagster (orchestration 프로필, 6편)",
    "monitoring: Prometheus, Grafana (monitoring 프로필, 7편)",
    "timeseries: Time Series 과제 (데이터를 내려받는다)",
    "vision: Vision 과제 (데이터와 사전학습 가중치를 내려받는다)",
    "llm: LLM 과제 (데이터와 테스트용 작은 모델을 내려받는다)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Windows 드라이브(WSL의 /mnt/c)에서는 모든 파일이 실행 권한으로 보여서 오탐이 난다
ignore = ["EXE002"]
