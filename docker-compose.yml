# MLOps 입문 시리즈 실습 스택
#
#   기본(4편)                 postgres, seaweedfs, mlflow
#   --profile serving        + triton (5편)
#   --profile orchestration  + dagster (6편)
#   --profile monitoring     + prometheus, grafana (7편)
#   workspace                실습 코드와 테스트를 돌리는 Python 컨테이너 (docker compose run)
#
# 호스트 포트는 127.0.0.1에만 열고, 번호는 .env에서 바꿀 수 있다.

name: mlops

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 10s

x-postgres-client-env: &postgres-client-env
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:?.env를 만드세요 (cp .env.example .env)}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env를 만드세요}
  MLFLOW_DB: ${MLFLOW_DB:-mlflow}
  DAGSTER_DB: ${DAGSTER_DB:-dagster}

x-stack-client-env: &stack-client-env
  <<: *postgres-client-env
  MLFLOW_TRACKING_URI: http://mlflow:5000
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?.env를 만드세요}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?.env를 만드세요}
  MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow}
  DATA_BUCKET: ${DATA_BUCKET:-data}
  TRITON_URL: http://triton:8000
  TRITON_METRICS_URL: http://triton:8002
  DAGSTER_URL: http://dagster-webserver:3000
  PROMETHEUS_URL: http://prometheus:9090
  GRAFANA_URL: http://grafana:3000

# 실습 코드, 테스트, Dagster가 같이 쓰는 Python 이미지 (uv.lock으로 의존성 고정)
x-app-image: &app-image
  build:
    context: .
    dockerfile: infra/app/Dockerfile
  image: mlops/app:local

# 학습이 도는 컨테이너(workspace, dagster-code)는 메모리 상한을 둬서, 넘치면 그 컨테이너만 죽게 한다
x-training-limits: &training-limits
  mem_limit: ${TRAINING_MEM_LIMIT:-5g}
  # 스왑까지 같은 값으로 묶는다. 안 그러면 상한을 넘어도 스왑으로 밀려 죽지 않고 몹시 느려진다
  memswap_limit: ${TRAINING_MEM_LIMIT:-5g}

# Hugging Face 모델·데이터, torchvision 가중치 캐시. 한 번 받으면 컨테이너끼리 같이 쓴다
x-model-cache: &model-cache model-cache:/cache

# 실행은 dagster-code에서 돌고 UI는 dagster-webserver가 보여 주므로,
# 실행 로그(stdout/stderr)와 로컬 산출물이 쌓이는 $DAGSTER_HOME/storage를 공유한다
x-dagster-storage: &dagster-storage dagster-storage:/opt/dagster/dagster_home/storage

services:
  # ---------- 기본: 4편 ----------

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env를 만드세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env를 만드세요}
      POSTGRES_DB: ${MLFLOW_DB:-mlflow}
      DAGSTER_DB: ${DAGSTER_DB:-dagster}
    volumes:
      # postgres 18부터 데이터 경로가 버전별 하위 폴더라서 /var/lib/postgresql에 붙인다
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      <<: *healthcheck
      # -h 127.0.0.1: 첫 초기화 중 임시 서버는 소켓만 열므로, TCP로 확인해야 초기화가 끝난 뒤 healthy가 된다
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    # mini: 마스터, 볼륨, 필러, S3 게이트웨이를 한 프로세스로 띄우는 단일 노드 모드
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      # 이 키가 S3 관리자 자격 증명이 된다
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?.env를 만드세요}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?.env를 만드세요}
    volumes:
      - seaweedfs-data:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
      - "127.0.0.1:${SEAWEEDFS_FILER_PORT:-8888}:8888"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
    restart: unless-stopped

  create-buckets:
    image: mlops/mlflow:3.17.2
    build:
      context: infra/mlflow
    entrypoint: ["python", "/scripts/create_buckets.py"]
    environment:
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?.env를 만드세요}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?.env를 만드세요}
      BUCKETS: ${MLFLOW_BUCKET:-mlflow},${DATA_BUCKET:-data}
    volumes:
      - ./infra/seaweedfs/create_buckets.py:/scripts/create_buckets.py:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  mlflow:
    image: mlops/mlflow:3.17.2
    build:
      context: infra/mlflow
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000"]
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${MLFLOW_DB:-mlflow}
      # 프록시 방식: 클라이언트는 서버에만 보내고, 서버가 이 버킷에 쓴다.
      # 내려받을 때는 서버가 서명한 주소(http://seaweedfs:8333/...)로 클라이언트가 버킷에서 직접 받는다
      # (MLflow 3.17 기본). 그래서 클라이언트에 키는 없어도 seaweedfs에 닿는 네트워크는 필요하다
      MLFLOW_ARTIFACTS_DESTINATION: s3://${MLFLOW_BUCKET:-mlflow}
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?.env를 만드세요}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?.env를 만드세요}
      MLFLOW_WORKERS: "2"
      # 3.x 서버는 GenAI 평가, 트레이스 집계용 작업 실행기(huey)를 같이 띄운다(약 1.3GB).
      # 이 시리즈는 쓰지 않으므로 끈다
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      # 기본값은 localhost와 사설 IP만 허용한다. 다른 컨테이너가 서비스 이름으로 부를 수 있게 추가
      MLFLOW_SERVER_ALLOWED_HOSTS: localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow,mlflow:*
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
    restart: unless-stopped

  # ---------- serving: 5편 ----------

  triton:
    image: nvcr.io/nvidia/tritonserver:26.10-py3
    profiles: [serving]
    # explicit: 로드/언로드를 API로 직접 시킨다. poll 모드를 보려면 --model-control-mode=poll --repository-poll-secs=5
    command:
      - tritonserver
      - --model-repository=/models
      - --model-control-mode=explicit
    volumes:
      - ./model_repository:/models
    shm_size: 1g
    ports:
      - "127.0.0.1:${TRITON_HTTP_PORT:-8000}:8000"
      - "127.0.0.1:${TRITON_GRPC_PORT:-8001}:8001"
      - "127.0.0.1:${TRITON_METRICS_PORT:-8002}:8002"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/v2/health/ready"]
    restart: unless-stopped

  # ---------- orchestration: 6편 ----------

  dagster-code:
    <<: [*app-image, *training-limits]
    profiles: [orchestration]
    # code-server는 UI의 Reload로 코드 변경을 다시 읽는다
    command: ["dagster", "code-server", "start", "-h", "0.0.0.0", "-p", "4000", "-m", "pipelines", "-d", "/workspace"]
    environment:
      <<: *stack-client-env
    volumes:
      - .:/workspace:ro
      - *dagster-storage
      - *model-cache
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "dagster", "api", "grpc-health-check", "-p", "4000"]
    restart: unless-stopped

  dagster-webserver:
    <<: *app-image
    profiles: [orchestration]
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/dagster_home/workspace.yaml"]
    environment:
      <<: *postgres-client-env
    volumes:
      - *dagster-storage
    ports:
      - "127.0.0.1:${DAGSTER_PORT:-3000}:3000"
    depends_on:
      dagster-code:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=4)"]
    restart: unless-stopped

  dagster-daemon:
    <<: *app-image
    profiles: [orchestration]
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/dagster_home/workspace.yaml"]
    environment:
      <<: *postgres-client-env
    volumes:
      - *dagster-storage
    depends_on:
      dagster-code:
        condition: service_healthy
    restart: unless-stopped

  # ---------- monitoring: 7편 ----------

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [monitoring]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?.env를 만드세요}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
    restart: unless-stopped

  # ---------- 실습 코드 실행용 ----------

  workspace:
    <<: [*app-image, *training-limits]
    # up으로는 뜨지 않고, docker compose run --rm workspace <명령>으로 쓴다
    profiles: [tools]
    # Linux에서 컨테이너가 저장소에 만든 파일(mlflow.db 등)이 root 소유가 되지 않게 호스트 사용자로 돈다
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    environment:
      <<: *stack-client-env
      HOME: /tmp
      USER: ${USER:-mlops}
      # 저장소의 mlops 패키지는 설치하지 않고 경로로 import한다. 하위 폴더의 스크립트
      # (python practice/ch03/train.py)에서도 import mlops가 되도록 저장소 루트를 넣는다
      PYTHONPATH: /workspace
      # 3편처럼 컨테이너 안에서 mlflow ui를 띄울 때도 작업 실행기는 끈다
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      # 스택 테스트에서 Grafana API를 확인할 때만 쓴다
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?.env를 만드세요}
    volumes:
      - .:/workspace
      - *model-cache
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  postgres-data:
  seaweedfs-data:
  dagster-storage:
  model-cache:
  prometheus-data:
  grafana-data:
